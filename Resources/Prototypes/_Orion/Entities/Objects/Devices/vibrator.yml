- type: entity
  parent: BaseItem
  id: BaseVibrator
  abstract: true
  components:
  - type: Sprite
    layers:
      - state: off
  - type: GenericVisualizer
    visuals:
      enum.VibratorVisuals.Intensity:
        base:
          Off: { state: off }
          Low: { state: low }
          Medium: { state: medium }
          High: { state: high }
  - type: Vibrator
    isTogglable: true
    vibrationSound: /Audio/_Orion/Effects/Devices/vibration_loop.ogg
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
      - SetLow
      - SetMedium
      - SetHigh
      - SetIntensity
  - type: ItemToggle
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 2
    unequipDelay: 5
    quickEquip: false
    slots:
    - underwear
  - type: Appearance
  # Goob-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_drop.ogg
      params:
        volume: -4
  # Goob-End

