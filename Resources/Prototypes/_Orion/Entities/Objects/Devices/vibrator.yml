- type: entity
  parent: ClothingUnderwearBase
  id: BaseVibrator
  abstract: true
  components:
  - type: Sprite
    layers:
      - state: off
        zIndex: 0
      - state: off
        zIndex: 1
        key: VibratorVisuals.Intensity
        visuals:
          VibratorIntensity.Off: off
          VibratorIntensity.Low: low
          VibratorIntensity.Medium: medium
          VibratorIntensity.High: high
  - type: Vibrator
    isTogglable: true
    jitterProbability: 70
    vibrationSound: /Audio/_Orion/Effects/Devices/vibration_loop.ogg
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
      - SetLow
      - SetMedium
      - SetHigh
      - SetIntensity
  - type: ItemToggle
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 2
    unequipDelay: 5

